# 시크릿 스캔 — 푸시된 커밋에 자격증명이 들어갔는가.
#
# ## 왜 main.yml 안의 job 이 아니라 따로인가
#
# 이 저장소의 CI 워크플로는 `paths`/`paths-ignore` 로 코드 변경일 때만 돈다. 코드 검증에는
# 맞는 선택이지만 **시크릿 스캔에는 틀린다** — docs 나 `.md` 에 키를 넣으면 검사가 아예
# 안 돈다. 검사의 질문이 "코드에 시크릿이 있나" 가 아니라 "시크릿이 있나" 이므로 이
# 워크플로는 경로를 가리지 않는다. (kepco-capacity 가 2026-09-14 에 먼저 이 모양으로
# 갔고, fleet 이 그 판을 그대로 가져왔다 — 본문은 그쪽과 바이트 동일하게 유지한다.)
#
# ## ADR-0082 결정 3 의 배선
#
# 공식 gitleaks-action v2 는 org 저장소에 `GITLEAKS_LICENSE` 를 요구해 바이너리 직행이다.
# ADR 이 "**신규 위반만** 잡아 소음이 없다" 를 근거로 삼으므로 범위 스캔이 기준이다 —
# 전 이력 스캔은 과거의 오탐까지 잡아 영원히 빨간불이 되므로 게이트로 못 쓴다.
#
# 전 이력은 2026-09-14 에 로컬에서 한 번 훑었다 — 5 커밋, gitleaks 8.30.1 기본 룰,
# 발견 0건. 실제 유출로 판정된 것은 없다.
#
# ## 세 층 중 가운데
#
#   .githooks/pre-commit   커밋을 막는다        로컬 · `--no-verify` 로 넘길 수 있다
#   이 워크플로             푸시 뒤 알린다       서버 · 넘길 수 없다 · **무료**
#   GitHub push protection 푸시를 막는다        유료(Secret Protection, 커미터당) · 미구매
#
# 가운데 층은 **이미 푸시된 뒤**에 잡는다. 시크릿은 푸시되는 순간 노출로 쳐야 하므로
# (원격 로그·캐시에 남는다) 이것이 push protection 을 대체하지는 않는다. 다만 훅을 안 켠
# 클론에서 온 커밋도 잡는다 — 훅만으로는 못 하는 일이다.
#
# ## ⚠️ 훅과 이 스캔은 **서로 부분집합이 아니다** (kepco 2026-09-14 실측)
#
#   AKIA + 16자 (맥락 없는 AWS 키)            훅 ✅ 탐지   gitleaks ❌ 놓침
#   ghp_… (GitHub PAT)                        훅 ✅ 탐지   gitleaks ✅ 탐지
#
# gitleaks 는 AWS 규칙에 주변 맥락을 요구해서 `AWS_ACCESS_KEY_ID=<16자>` 한 줄을 그냥
# 지나친다. 반대로 gitleaks 는 훅이 모르는 수십 가지 제공자를 안다. **어느 쪽도 "이걸
# 켰으니 안전하다" 가 아니다.** 둘 다 두는 이유가 그것이고, 한쪽을 지울 때는 그쪽만 잡던
# 것이 무엇인지 먼저 확인해야 한다.

name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 범위 계산에 조상이 필요하다

      - name: gitleaks 설치
        env:
          # 버전을 못박는다. 룰셋이 바뀌면 통과·실패가 조용히 달라진다.
          # fleet 과 같은 판을 쓴다 (audit/.github/workflows/main.yml). 룰셋이 갈리면
          # 저장소마다 통과·실패가 달라지고, 그 차이는 사고가 난 뒤에만 보인다.
          VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install -m0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 범위를 정한다. **못 정하면 실패한다** — 범위가 비면 스캔이 0개 커밋을 훑고
      # "통과" 로 끝난다. 검사가 "통과" 가 아니라 "못 돌았다" 를 말해야 한다
      # (2026-09-13 에 pre-commit 훅이 정확히 그렇게 조용히 통과했다).
      - name: 검사 범위
        id: range
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # 새 브랜치·첫 푸시는 before 가 0000… 이다. 그때는 최근 50개만 본다 —
          # 전 이력 스캔은 과거 유출까지 잡아 **영원히 빨간불**이 되므로 게이트로 못 쓴다.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "opts=--log-opts=-n 50 $head" >> "$GITHUB_OUTPUT"
            echo "새 ref — 최근 50 커밋"
          else
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::error::base 커밋($base)을 못 찾는다 — 범위를 정할 수 없다. 통과로 넘기지 않는다."
              exit 1
            fi
            echo "opts=--log-opts=$base..$head" >> "$GITHUB_OUTPUT"
            echo "범위 $base..$head"
          fi

      - name: gitleaks
        run: |
          set -euo pipefail
          # `--redact` — 발견한 값을 로그에 찍지 않는다. Actions 로그는 조직 구성원이
          # 볼 수 있고 보존된다. 진단하려고 시크릿을 거기 남기면 막으려던 것을 스스로 한다.
          gitleaks detect --no-banner --redact --exit-code 2 \
            --report-format sarif --report-path /tmp/leaks.sarif \
            "${{ steps.range.outputs.opts }}" && rc=0 || rc=$?
          if [ "${rc:-0}" = "2" ]; then
            echo "::error::시크릿으로 보이는 것이 발견됐다. 값은 로그에 찍지 않는다 — 아티팩트의 SARIF 를 보라."
            exit 1
          fi
          exit "${rc:-0}"

      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: /tmp/leaks.sarif
          if-no-files-found: ignore
          retention-days: 7
