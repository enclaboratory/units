name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-checks:
    name: Go build + vet + fmt + test
    if: "! contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # zero-dependency module — go.sum 없음, go.mod 를 캐시 키로 사용
          cache-dependency-path: go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt 적용 필요한 파일들:"
            echo "$diff"
            exit 1
          fi
      - name: go test
        run: go test ./... -count=1 -race
