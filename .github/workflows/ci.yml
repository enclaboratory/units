name: CI

# 트리거별로 도는 것 (2026-10-19 사용자 결정 — Actions 분 절감. GitHub 는 잡마다 분 단위로 올림 과금한다):
#   push (main·태그)     → quick + 전체 테스트. 이 repo 의 lefthook 에는 pre-push 테스트 훅이 없어서 push 에서
#                           테스트를 빼면 다음 03:00 nightly 까지 아무도 테스트를 돌리지 않는다. 10월 분 사용량이
#                           작아 push 테스트를 유지한다 (orchestrator 검토 2026-10-19). 태그는 소비자가 고정해
#                           받는 릴리스이기도 하다.
#   schedule (03:00 KST)  → nightly-gate → main 이 마지막 성공 schedule run 이후 바뀌었을 때만 전체 테스트
#   workflow_dispatch     → quick + 전체 테스트 (필요할 때 수동으로)
#   pull_request          → quick + 전체 테스트 (Dependabot PR 도 이 결과를 본다)
# public repo — 권한은 contents·actions read 만. pull_request 경로에는 시크릿을 읽는 스텝이 없다
# (fork PR 은 시크릿을 받지 않는다). nightly-gate 의 GITHUB_TOKEN 은 schedule 에서만 쓴다.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/**"
      - ".golangci.yml"
      # docs-sync — 생성물·생성 스크립트만 바뀐 push 도 검사 대상 (손편집 드리프트 차단)
      - "docs/reference/**"
      - "scripts/gen-docs.sh"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "scripts/**"
      - ".github/workflows/**"
      - ".golangci.yml"
      - "docs/reference/**"
      - "scripts/gen-docs.sh"
  schedule:
    - cron: "0 18 * * *" # 03:00 KST, 기본 브랜치(main) 대상
  workflow_dispatch:

permissions:
  contents: read
  actions: read # nightly-gate 가 지난 schedule 실행을 조회한다

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 가벼운 검사를 한 잡의 스텝으로 묶는다 (잡마다 분 단위 올림 과금). schedule 에서는 돌지 않는다 —
  # 같은 커밋은 push 때 이미 지났다.
  quick:
    name: quick (vet · build · gofmt · docs-sync)
    if: github.event_name != 'schedule' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # lint-new 가 기준 커밋(event.before)을 찾는다
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # zero-dependency module — go.sum 없음, go.mod 를 캐시 키로 사용
          cache-dependency-path: go.mod
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: gofmt check
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "::error::gofmt 적용 필요한 파일들:"
            echo "$diff"
            exit 1
          fi
      # docs-sync (2026-09-14, audit 파일럿 이식) — docs/reference/ 는 godoc 주석에서 만든 **생성물**이다.
      # 주석을 고치고 재생성을 빼먹으면(또는 생성물을 손으로 고치면) 팀원이 읽는 문서가 코드와
      # 어긋난다. 이 repo 는 lefthook 이 없어 로컬 자동 재생성이 없으므로 이 검사가 유일한 게이트다.
      # 도구 버전은 scripts/gen-docs.sh 의 `go run ...@vX` 핀 — 러너와 로컬이 같은 바이너리를
      # 쓰므로 "내 머신에선 같았다" 가 없다. zero-dependency 모듈이라 private module git config 는
      # 필요 없고, proto 가 없어 buf 도 부르지 않는다. 검사 범위는 docs/reference 만.
      # 새 위반만 보는 golangci-lint — push 마다 (ADR-0082 v1.1 결정 4, 2026-11-17). 명령은 scripts/lint 한 곳(lefthook pre-push 와 같다).
      # 기준: push = 직전 main(event.before), PR = 대상 브랜치. 못 찾으면 실패 — 짐작하지 않는다. 태그 push 는 이미 지난 main 커밋이라 건너뛴다.
      # action v8 에는 install-only 가 없다 (2026-11-16 실측) — v9.
      - name: golangci-lint 설치
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true
      - name: lint-new (새 위반만 — scripts/lint go)
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --quiet origin "$BASE_REF"
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            base="$BEFORE"
            git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$base"
          else
            echo "::error::lint-new 기준 커밋이 없다 (첫 push·force push — event.before=$BEFORE). 짐작하지 않는다 — 로컬에서 scripts/lint go 로 확인 뒤 다시 push"
            exit 1
          fi
          scripts/lint go --new-from-rev="$base"
      - name: docs-sync (docs/reference == source comments)
        run: scripts/gen-docs.sh check

  # 스케줄 실행 전에 '돌 필요가 있나' 만 본다 (API 조회 한 번 — checkout 없음, ppa playwright.yml 선례).
  # 이 워크플로의 마지막 성공한 schedule run 이 지금과 같은 커밋이면 run=false. 조회 실패면 run=true (안전 쪽).
  # 건너뛴 schedule run 도 success 로 남지만, 그 head_sha 는 이미 통과한 커밋과 같아서 기준이 흔들리지 않는다.
  nightly-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&branch=main&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || last=""
          if [ -n "$last" ] && [ "$last" = "$SHA" ]; then run=false; else run=true; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "nightly: run=$run (마지막 성공 schedule ${last:-없음} · 현재 $SHA)"

  # 전체 테스트 — push(main·태그)·dispatch·PR 에서 돈다 (pre-push 훅이 없다). schedule 은 nightly-gate 가 run=true 일 때만.
  test:
    name: Go test
    needs: [quick, nightly-gate]
    if: >-
      !cancelled() && needs.quick.result != 'failure'
      && !contains(github.event.head_commit.message, '[skip ci]')
      && (github.event_name != 'schedule' || needs.nightly-gate.outputs.run == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod
      - name: go test
        run: scripts/test
